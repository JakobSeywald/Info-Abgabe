<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informatik-Abgabe-Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="page">
        <header>
            <div class="uni-badge">Universität Augsburg · Informatik</div>
            <h1>Übungsblatt-Abgabe</h1>
            <p>Dateien hochladen → fertige PDF und ZIP herunterladen</p>
        </header>

        <!-- Upload Section -->
        <div class="card">
            <p class="sec-label">Quelldateien</p>
            <div class="upload-row">
                <div class="drop" id="dropZone" 
                    ondragover="event.preventDefault();this.classList.add('over')"
                    ondragleave="this.classList.remove('over')"
                    ondrop="this.classList.remove('over');handleDrop(event)">
                    <div class="icon">📁</div>
                    <p>Dateien ablegen</p>
                    <small>Oder <button type="button" class="link-btn" id="fileInputBtn">klicke zum Hochladen</button></small>
                </div>
            </div>
            <input type="file" id="fileInput" multiple style="display: none;">
            <div class="info-box blue" id="folderInfo"></div>
            <div class="flist" id="flist"></div>
        </div>

        <!-- Settings Section -->
        <div class="card">
            <p class="sec-label">Einstellungen</p>
            <div>
                <label>Übungsnummer</label>
                <input type="number" id="uebungsnummer" placeholder="z.B. 1" min="1" max="20" value="1" style="width:120px;"/>
            </div>
        </div>

        <!-- Generate Button -->
        <div class="card">
            <div class="btn-wrap">
                <button class="btn" id="generateBtn" onclick="generate()">PDF & ZIP erstellen und herunterladen</button>
            </div>
            <div class="status" id="status"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
